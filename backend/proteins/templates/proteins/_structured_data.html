<script type="application/ld+json">
{
  "@context":"http://schema.org/",
  "@type":"Dataset",
  "name":"{{ protein.name|escapejs }}",
  "description":"{{ protein.description|escapejs }}",
  "url":"https://www.fpbase.org{{protein.get_absolute_url}}",
  "license":"https://creativecommons.org/licenses/by-sa/4.0/",
  {% if protein.has_spectra %}"image":"https://www.fpbase.org/spectra_img/{{protein.slug}}.svg",{% endif %}
  "keywords":[
     "FLUORESCENT PROTEIN",
     "FLUORESCENT PROTEINS > SPECTRA",
     "FLUORESCENT PROTEINS > PROPERTIES",
     "FLUORESCENT PROTEINS > SEQUENCE",
     "FLUORESCENCE"
  ],
  "variableMeasured": [
    {% if protein.default_state %}{% with state=protein.default_state %}
    {% if state.ex_max is not None %}
    {
      "@type": "PropertyValue",
      "name": "Excitation Maximum",
      "value": {{ state.ex_max }},
      "unitCode": "C45"
    },
    {% endif %}
    {% if state.em_max is not None %}
    {
      "@type": "PropertyValue",
      "name": "Emission Maximum",
      "value": {{ state.em_max }},
      "unitCode": "C45"
    },
    {% endif %}
    {% if state.ext_coeff is not None %}
    {
      "@type": "PropertyValue",
      "sameAs": "https://en.wikipedia.org/wiki/Molar_attenuation_coefficient",
      "name": "Extinction Coefficient",
      "value": {{ state.ext_coeff }},
      "unitText": "M-1 cm-1"
    },
    {% endif %}
    {% if state.qy is not None %}
    {
      "@type": "PropertyValue",
      "sameAs": "https://en.wikipedia.org/wiki/Quantum_yield",
      "name": "Quantum Yield",
      "value": {{ state.qy }}
    },
    {% endif %}
    {% if state.lifetime is not None %}
    {
      "@type": "PropertyValue",
      "sameAs": "https://en.wikipedia.org/wiki/Fluorescence#Lifetime",
      "name": "Fluorescence Lifetime",
      "value": {{ state.lifetime }},
      "unitText": "ns"
    },
    {% endif %}
    {% if state.pka is not None %}
    {
      "@type": "PropertyValue",
      "sameAs": "https://en.wikipedia.org/wiki/Acid_dissociation_constant",
      "name": "Acid dissociation constant",
      "value": {{ state.pka }},
      "unitText": "pKA"
    },
    {% endif %}
    {% endwith %}{% endif %}
    {% if protein.seq %}
    {
      "@type": "PropertyValue",
      "sameAs": "https://en.wikipedia.org/wiki/Protein_primary_structure",
      "name": "Amino Acid Sequence",
      "value": "{{ protein.seq }}"
    },
    {
      "@type": "PropertyValue",
      "sameAs": "https://en.wikipedia.org/wiki/Molecular_mass",
      "name": "Molecular Weight",
      "value": {{ protein.seq.weight|floatformat:"1" }},
      "unitText": "kDa"
    },
    {% endif %}
    {
      "@type": "PropertyValue",
      "name": "Oligomerization",
      "value": "{{protein.get_agg_display|default:'null'}}"
    }
  ],
  "includedInDataCatalog":{
     "@type":"DataCatalog",
     "name":"fpbase.org"
  },
  "distribution":[
     {
        "@type":"DataDownload",
        "encodingFormat":"JSON",
        "contentUrl":"https://www.fpbase.org/api/proteins/?slug={{protein.slug}}&format=json"
     },
     {
        "@type":"DataDownload",
        "encodingFormat":"CSV",
        "contentUrl":"https://www.fpbase.org/api/proteins/?slug={{protein.slug}}&format=csv"
     }
  ]
}
</script>
